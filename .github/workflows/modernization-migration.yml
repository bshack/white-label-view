name: Modernization migration

on:
  push:
    branches: [chore/modernize-tooling-20260912]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/modernize-tooling-20260912
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Modernize configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.types = pkg.types || 'dist/index.d.ts';
          pkg.exports = {'.': {types: `./${pkg.types}`, require: `./${pkg.main}`, default: `./${pkg.main}`}};
          pkg.engines = {node: '^22.18.0 || >=24.11.0', npm: '>=11.0'};
          pkg.packageManager = 'npm@11.19.1';
          pkg.scripts = {...pkg.scripts, lint: 'eslint "src/**/*.ts" --max-warnings=0', 'lint:fix': 'npm run lint -- --fix'};
          pkg.devDependencies = {...pkg.devDependencies, '@babel/core': '8.0.5', '@babel/eslint-parser': '8.0.5', '@babel/preset-typescript': '8.0.1', '@eslint/js': '10.0.1', eslint: '10.10.0'};
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const ts = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          Object.assign(ts.compilerOptions, {noUncheckedIndexedAccess: true, noImplicitOverride: true, noFallthroughCasesInSwitch: true, noImplicitReturns: true});
          delete ts.compilerOptions.exactOptionalPropertyTypes;
          fs.writeFileSync('tsconfig.json', JSON.stringify(ts, null, 2) + '\n');
          NODE
          cat > eslint.config.mjs <<'EOF'
          import babelParser from '@babel/eslint-parser';
          import js from '@eslint/js';
          export default [
            {ignores: ['dist/**', 'coverage/**', 'node_modules/**']},
            {files: ['src/**/*.ts'], languageOptions: {parser: babelParser, parserOptions: {requireConfigFile: false, sourceType: 'unambiguous', babelOptions: {presets: ['@babel/preset-typescript']}}}, rules: {...js.configs.recommended.rules, 'no-undef': 'off', 'no-unused-vars': 'off', curly: ['error', 'all'], eqeqeq: ['error', 'always'], 'no-eval': 'error', 'no-implied-eval': 'error', 'no-new-wrappers': 'error', 'no-var': 'error', 'prefer-const': 'error'}},
          ];
          EOF
          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /
              schedule: {interval: weekly, day: monday, time: "09:00", timezone: America/New_York}
              open-pull-requests-limit: 10
              groups:
                production-dependencies: {dependency-type: production, update-types: [minor, patch]}
                development-dependencies: {dependency-type: development, update-types: [minor, patch]}
            - package-ecosystem: github-actions
              directory: /
              schedule: {interval: weekly, day: monday, time: "09:15", timezone: America/New_York}
              groups:
                github-actions: {patterns: ["*"]}
          EOF
      - run: npm install --ignore-scripts
      - run: npm run lint:fix
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit modernization data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tsconfig.json eslint.config.mjs .github/dependabot.yml src dist
          git diff --cached --quiet || git commit -m "Modernize project tooling and package metadata"
          git push
