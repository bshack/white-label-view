name: Keep README current-state only

on:
  push:
    branches:
      - docs/remove-version-history-20260911
    paths:
      - .github/workflows/readme-current-state.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove release-history documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = """### Version 5 migration

The historically named `initializeTwoWayBinding()` and `destroyTwoWayBinding()` methods have been removed. The binding has always been one-way; use `initializeModelBinding()` and `destroyModelBinding()` instead. No compatibility aliases are provided.

"""
          if old not in text:
              raise SystemExit('expected migration section not found')
          text = text.replace(old, '')
          text = text.replace('Breaking public API changes are communicated with a Semantic Versioning major release and documented migration notes.', 'Breaking public API changes are communicated with a Semantic Versioning major release and migration notes outside this README.')
          p.write_text(text)
          PY
          if grep -En '^#{2,3} Version [0-9]+.*migration|version [0-9]+\.[0-9]+\.[0-9]+ migration|This is a major release' README.md; then
            echo 'README still contains project release-history prose.' >&2
            exit 1
          fi
      - name: Commit README
        run: |
          git add README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Keep README focused on current View API'
          git push
