name: Google style migration

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Configure current lint tooling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts = {...pkg.scripts, lint: 'npm run format:check && eslint "**/*.{ts,tsx}"', 'lint:fix': 'prettier --write "**/*.{ts,tsx}" && eslint --fix "**/*.{ts,tsx}"', 'format:check': 'prettier --check "**/*.{ts,tsx}"'};
          pkg.devDependencies = {...pkg.devDependencies, '@eslint/js': '10.0.1', '@typescript/native': 'npm:typescript@7.0.2', eslint: '10.10.0', prettier: '3.9.5', typescript: 'npm:@typescript/typescript6@6.0.2', 'typescript-eslint': '8.70.0'};
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --ignore-scripts
          cat > eslint.config.cjs <<'EOF'
          'use strict';
          const js = require('@eslint/js');
          const tseslint = require('typescript-eslint');
          module.exports = tseslint.config(
            {ignores: ['dist/**', 'node_modules/**', 'coverage/**']},
            js.configs.recommended,
            ...tseslint.configs.recommended,
            ...tseslint.configs.stylistic,
            {files: ['**/*.ts', '**/*.tsx'], rules: {curly: ['error', 'all'], eqeqeq: ['error', 'always'], 'no-eval': 'error', 'no-implied-eval': 'error', 'no-new-wrappers': 'error', 'no-var': 'error', 'object-shorthand': ['error', 'always'], 'prefer-arrow-callback': ['error', {allowNamedFunctions: true}], 'prefer-const': 'error', 'prefer-template': 'error', 'quote-props': ['error', 'as-needed'], '@typescript-eslint/array-type': ['error', {default: 'array-simple'}], '@typescript-eslint/consistent-type-assertions': ['error', {assertionStyle: 'as'}], '@typescript-eslint/consistent-type-imports': ['error', {prefer: 'type-imports'}], '@typescript-eslint/no-explicit-any': 'error', '@typescript-eslint/no-non-null-assertion': 'error'}}
          );
          EOF
          cat > .prettierrc.json <<'EOF'
          {"bracketSpacing":false,"singleQuote":true,"trailingComma":"all","arrowParens":"avoid"}
          EOF
          cat > .prettierignore <<'EOF'
          dist/
          node_modules/
          coverage/
          EOF
          cat > STYLE.md <<'EOF'
          # Code style

          This project follows the Google TypeScript Style Guide. ESLint enforces correctness and TypeScript style rules, while Prettier uses Google's published GTS formatting choices.

          TypeScript 7 remains the build compiler. The TypeScript 6 compatibility API is installed side-by-side for lint tooling, following the TypeScript 7 release guidance until the lint ecosystem moves to the TypeScript 7 API.

          - Run `npm run lint` to verify style and lint rules.
          - Run `npm run lint:fix` to apply safe automatic fixes.
          - Do not suppress warnings or disable rules simply to make CI pass; fix the underlying code unless a narrowly documented exception is technically required.
          - Generated output under `dist/` is not linted or formatted directly; it is regenerated from linted source.
          EOF
      - run: npm run lint:fix
      - run: npm run lint
      - run: npm run build
      - name: Add lint to permanent CI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const candidates = ['.github/workflows/security.yml', '.github/workflows/ci.yml'];
          const file = candidates.find(candidate => fs.existsSync(candidate));
          if (!file) throw new Error('No permanent CI workflow found');
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes('npm run lint')) {
            const marker = '      - run: npm ci --ignore-scripts\n';
            if (!source.includes(marker)) throw new Error('npm ci step not found in permanent CI');
            source = source.replace(marker, marker + '      - run: npm run lint\n');
            fs.writeFileSync(file, source);
          }
          NODE
      - run: rm .github/workflows/google-style-migration.yml
      - name: Commit migration
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Adopt Google TypeScript Style with ESLint"
            git push
          fi
