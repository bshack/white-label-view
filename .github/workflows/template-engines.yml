name: Template engine compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  template-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Create packed package
        run: npm pack --silent
      - name: Verify tagged templates and third-party engines
        run: |
          PACKAGE="$(realpath *.tgz)"
          TEMP="$(mktemp -d)"
          cp integration/template-engines.test.mjs "$TEMP/template-engines.test.mjs"
          cp integration/kita-template.tsx "$TEMP/kita-template.tsx"
          cd "$TEMP"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-save \
            "$PACKAGE" \
            @kitajs/html@4.2.13 \
            typescript@7.0.2 \
            handlebars@4.7.9 \
            eta@4.6.0 \
            ejs@6.0.1 \
            mustache@4.2.0 \
            nunjucks@3.2.4 \
            pug@3.0.4 \
            jsdom@30.0.1 >/dev/null
          npx tsc kita-template.tsx \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --jsx react-jsx \
            --jsxImportSource @kitajs/html \
            --skipLibCheck
          node --test template-engines.test.mjs
