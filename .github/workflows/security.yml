name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel a pull request run once a newer push to that pull request starts. Push, schedule and manual runs
# each get their own group, so they are never cancelled or queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      # coverage rebuilds dist, typechecks, runs the consumer type checks and every Node test.
      - run: npm run coverage
      # Short benchmark against benchmark/baseline.json; fails only beyond 3x the baseline or on a counter change.
      - run: node benchmark/ci.bench.js
      # Short differential fuzz of the html tag against parse5 (fixed seed, so failures reproduce locally).
      - run: node scripts/fuzz-html.mjs --count=5000 --seed=1
      - run: npm run audit
      # dist was just built and tested; skip the prepare script so packing does not rebuild it again.
      - run: npm pack --dry-run --ignore-scripts
      - name: Create packed package
        run: npm pack --silent --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packed-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
      - name: Verify packed install
        run: |
          PACKAGE="$(ls *.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true}\n' > package.json
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node - <<'NODE'
          const View = require('white-label-view');
          const ServerView = require('white-label-view/server');
          const html = require('white-label-view/html');
          if (typeof View !== 'function' || typeof ServerView !== 'function' ||
              typeof html.html !== 'function' || typeof html.attributes !== 'function' ||
              typeof html.unsafeHTML !== 'function') process.exit(1);
          NODE

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  minimum-node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package-manager-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.9.2 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Verify packed package
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const html=require('white-label-view/html'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof html.html !== 'function') process.exit(1)"
              ;;
            yarn)
              yarn add "$PACKAGE" >/dev/null
              yarn node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const html=require('white-label-view/html'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof html.html !== 'function') process.exit(1)"
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const html=require('white-label-view/html'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof html.html !== 'function') process.exit(1)"
              ;;
          esac
