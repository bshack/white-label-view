name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: generated-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Create packed package
        run: npm pack --silent
      - uses: actions/upload-artifact@v7
        with:
          name: packed-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
      - name: Verify packed install
        run: |
          PACKAGE="$(ls *.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true}\n' > package.json
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node - <<'NODE'
          const View = require('white-label-view');
          const ServerView = require('white-label-view/server');
          const jsxRuntime = require('white-label-view/jsx-runtime');
          const jsxDevRuntime = require('white-label-view/jsx-dev-runtime');
          if (typeof View !== 'function' || typeof ServerView !== 'function' ||
              typeof jsxRuntime.jsx !== 'function' || typeof jsxRuntime.jsxs !== 'function' ||
              typeof jsxDevRuntime.jsxDEV !== 'function') process.exit(1);
          NODE

  package-manager-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v7
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.9.2 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Verify packed package
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const jsx=require('white-label-view/jsx-runtime'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof jsx.jsx !== 'function') process.exit(1)"
              ;;
            yarn)
              yarn add "$PACKAGE" >/dev/null
              yarn node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const jsx=require('white-label-view/jsx-runtime'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof jsx.jsx !== 'function') process.exit(1)"
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec node -e "const View=require('white-label-view'); const ServerView=require('white-label-view/server'); const jsx=require('white-label-view/jsx-runtime'); if (typeof View !== 'function' || typeof ServerView !== 'function' || typeof jsx.jsx !== 'function') process.exit(1)"
              ;;
          esac
