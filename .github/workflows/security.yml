name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: generated-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Verify packed install
        run: |
          PACKAGE="$(npm pack --silent)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node - <<'NODE'
          const View = require('white-label-view');
          const ServerView = require('white-label-view/server');
          const jsxRuntime = require('white-label-view/jsx-runtime');
          const jsxDevRuntime = require('white-label-view/jsx-dev-runtime');
          if (typeof View !== 'function' || typeof ServerView !== 'function' ||
              typeof jsxRuntime.jsx !== 'function' || typeof jsxRuntime.jsxs !== 'function' ||
              typeof jsxDevRuntime.jsxDEV !== 'function') process.exit(1);
          NODE
          rm "$GITHUB_WORKSPACE/$PACKAGE"
