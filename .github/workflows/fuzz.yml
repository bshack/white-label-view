name: HTML fuzz

on:
  schedule:
    # Weekly, Monday 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-html:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # A random seed explores new templates each week; the script prints the seed so a failure can be
      # reproduced with: npm run fuzz -- --count=<N> --seed=<seed>
      - run: node scripts/fuzz-html.mjs --count=500000 --seed=random
